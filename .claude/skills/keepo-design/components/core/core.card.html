<!-- @dsCard group="Components" viewport="700x300" name="Core" subtitle="Button, IconButton, Badge, Chip, Card, Icon" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keepo · Core</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="../../ds-card-runtime.js"></script>
    <style>
      body {
        margin: 0;
        padding: 18px 20px;
        background: var(--bg-app);
      }
      .grp {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .cap {
        font-family: var(--font-mono);
        font-size: 9.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/Keepo-jsx" id="card">
      ({ Button, IconButton, Badge, Chip, Card, Icon }) => (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div className="grp">
              <span className="cap">Button — variant</span>
              <div className="wrap">
                <Button variant="primary" icon={<Icon name="plus" size={17} />}>Ajouter</Button>
                <Button variant="secondary">Plus tard</Button>
                <Button variant="claim" icon={<Icon name="triangle-alert" size={17} />}>Déclarer</Button>
                <Button variant="inverse" size="sm">Tout lire</Button>
                <Button variant="ghost" size="sm">Annuler</Button>
                <Button disabled>Continuer</Button>
              </div>
            </div>
            <div className="grp">
              <span className="cap">IconButton · Badge · Chip</span>
              <div className="wrap">
                <IconButton label="Retour"><Icon name="chevron-left" /></IconButton>
                <IconButton label="Options" variant="ghost"><Icon name="ellipsis" /></IconButton>
                <IconButton label="Scanner" variant="brand"><Icon name="scan-line" /></IconButton>
                <Badge status="covered">7 mois</Badge>
                <Badge status="expiring">28 j</Badge>
                <Badge status="expired">Expirée</Badge>
                <Badge status="claim">En cours</Badge>
                <Badge status="pro" icon={<Icon name="lock" size={11} strokeWidth={3} />}>Pro</Badge>
                <Chip tone="neutral" selected>Tous</Chip>
                <Chip>Bientôt</Chip>
              </div>
            </div>
            <div className="grp">
              <span className="cap">Card — tone</span>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
                <Card tone="plain"><b style={{ fontFamily: 'var(--font-display)' }}>plain</b><div style={{ fontSize: 12, color: 'var(--text-secondary)' }}>rows, forms</div></Card>
                <Card tone="sunken"><b style={{ fontFamily: 'var(--font-display)' }}>sunken</b><div style={{ fontSize: 12, color: 'var(--text-secondary)' }}>groupings</div></Card>
                <Card tone="brand" size="hero"><b style={{ fontFamily: 'var(--font-display)' }}>brand</b><div style={{ fontSize: 12, opacity: 0.85 }}>one per screen</div></Card>
                <Card tone="inverse"><b style={{ fontFamily: 'var(--font-display)' }}>inverse</b><div style={{ fontSize: 12, opacity: 0.75 }}>tab bar</div></Card>
              </div>
            </div>
          </div>
      )
    </script>
    <script>
      KeepoCard(["Button", "IconButton", "Badge", "Chip", "Card", "Icon"]);
    </script>
  </body>
</html>
