<!-- @dsCard group="Components" viewport="700x380" name="Data" subtitle="ItemRow, CoverageBar, StatTile, DocumentRow" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keepo · Data</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="../../ds-card-runtime.js"></script>
    <style>
      body {
        margin: 0;
        padding: 18px 20px;
        background: var(--bg-app);
      }
      .grp {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .cap {
        font-family: var(--font-mono);
        font-size: 9.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/Keepo-jsx" id="card">
      ({ ItemRow, CoverageBar, StatTile, DocumentRow, Icon, Card, IconButton }) => (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div className="grp">
              <span className="cap">ItemRow — the three warranty states</span>
              <ItemRow name="iPhone 15 Pro" meta="Fnac Rivoli · mars 2025" status="covered" remaining="7 mois" icon={<Icon name="smartphone" size={24} />} />
              <ItemRow name="Lave-vaisselle Bosch Serie 6" meta="Darty Beaugrenelle · sept. 2024" status="expiring" remaining="28 j" icon={<Icon name="washing-machine" size={24} />} />
              <ItemRow name="Casque Sony WH-1000XM5" meta="Boulanger · nov. 2023" status="expired" remaining="Expirée" icon={<Icon name="headphones" size={24} />} />
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1.25fr 1fr', gap: 12, alignItems: 'start' }}>
              <div className="grp">
                <span className="cap">CoverageBar</span>
                <Card tone="plain"><CoverageBar pct={96} status="expiring" headline="Plus que 28 jours" note="2 ans" from="Achat · 4 sept. 2024" to="Fin · 4 sept. 2026" /></Card>
              </div>
              <div className="grp">
                <span className="cap">StatTile — inside a brand card</span>
                <Card tone="brand" size="hero" style={{ display: 'flex', gap: 8 }}>
                  <StatTile value="5" label="couverts" />
                  <StatTile value="1" label="bientôt" />
                  <StatTile value="1" label="expirée" />
                </Card>
              </div>
            </div>
            <div className="grp">
              <span className="cap">DocumentRow</span>
              <DocumentRow name="Recu_Bosch_Serie6.pdf" meta="PDF · 214 Ko · ajouté le 4 sept. 2024"
                action={<IconButton label="Télécharger" variant="ghost" size="sm"><Icon name="download" size={18} /></IconButton>} />
            </div>
          </div>
      )
    </script>
    <script>
      KeepoCard([
        "ItemRow",
        "CoverageBar",
        "StatTile",
        "DocumentRow",
        "Icon",
        "Card",
        "IconButton",
      ]);
    </script>
  </body>
</html>
