<!-- @dsCard group="Colors" viewport="700x170" name="Status pairs in use" subtitle="Every state is one tint + one text colour, never a hand-picked hex" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
  .line{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--radius-tile);background:var(--bg-card);box-shadow:var(--shadow-sm);margin-bottom:8px}
  .tile{width:34px;height:34px;border-radius:11px;flex:none}
  .nm{flex:1;font-family:var(--font-display);font-size:14px;font-weight:600}
</style></head><body>

<div class="line"><span class="tile" style="background:var(--status-covered-bg)"></span><span class="nm">Couvert</span><span class="pill" style="background:var(--status-covered-bg);color:var(--status-covered-fg)">7 mois</span></div>
<div class="line"><span class="tile" style="background:var(--status-expiring-bg)"></span><span class="nm">Bientôt</span><span class="pill" style="background:var(--status-expiring-bg);color:var(--status-expiring-fg)">28 j</span></div>
<div class="line" style="margin-bottom:0"><span class="tile" style="background:var(--status-expired-bg)"></span><span class="nm">Expiré</span><span class="pill" style="background:var(--status-expired-bg);color:var(--status-expired-fg)">Expirée</span></div>
</body></html>
