<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Warm-tinted and shallow; elevation is rare in Keepo" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: 18px 20px;
        background: var(--bg-app);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: stretch;
      }
      .sw {
        flex: 1;
        border-radius: var(--radius-tile);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 86px;
        box-sizing: border-box;
      }
      .sw b {
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sw code {
        font-family: var(--font-mono);
        font-size: 10.5px;
        opacity: 0.8;
      }
      .s {
        flex: 1;
        height: 80px;
        background: var(--bg-card);
        border-radius: var(--radius-card);
        display: grid;
        place-items: end center;
        padding-bottom: 8px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="row" style="padding: 6px 4px 14px">
      <div class="s" style="box-shadow: var(--shadow-sm)">sm · rows</div>
      <div class="s" style="box-shadow: var(--shadow-card)">card · CTA</div>
      <div class="s" style="box-shadow: var(--shadow-lift)">lift · toast</div>
    </div>
  </body>
</html>
