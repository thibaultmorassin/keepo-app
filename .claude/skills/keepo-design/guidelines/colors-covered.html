<!-- @dsCard group="Colors" viewport="700x150" name="Covered — green" subtitle="Also the brand colour: coverage is the product" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--green-100);color:var(--green-700)"><b>green 100</b><code>#E5F5EC · tint</code></div>
  <div class="sw" style="background:var(--green-200);color:var(--green-700)"><b>green 200</b><code>#C4E9D6 · focus</code></div>
  <div class="sw" style="background:var(--green-500);color:#fff"><b>green 500</b><code>#14996B · bar</code></div>
  <div class="sw" style="background:var(--green-600);color:#fff"><b>green 600</b><code>#0E7A56 · brand</code></div>
  <div class="sw" style="background:var(--green-700);color:#fff"><b>green 700</b><code>#0A5C41 · text</code></div>
</div></body></html>
