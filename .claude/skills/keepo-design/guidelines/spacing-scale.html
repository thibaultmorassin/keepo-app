<!-- @dsCard group="Spacing" viewport="700x150" name="Space scale" subtitle="4-based, with 6 and 18 kept as real steps" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  .bar{display:flex;align-items:flex-end;gap:10px}
  .u{background:var(--green-200);border-radius:4px;width:34px}
  .u span{display:block;text-align:center;font-family:var(--font-mono);font-size:9.5px;color:var(--text-secondary);margin-top:5px}
</style></head><body>

<div class="bar">
  <div><div class="u" style="height:4px"></div><span>4</span></div>
  <div><div class="u" style="height:8px"></div><span>8</span></div>
  <div><div class="u" style="height:12px"></div><span>12</span></div>
  <div><div class="u" style="height:16px"></div><span>16</span></div>
  <div><div class="u" style="height:20px"></div><span>20</span></div>
  <div><div class="u" style="height:24px"></div><span>24</span></div>
  <div><div class="u" style="height:32px"></div><span>32</span></div>
  <div><div class="u" style="height:40px"></div><span>40</span></div>
  <div><div class="u" style="height:56px"></div><span>56</span></div>
</div></body></html>
