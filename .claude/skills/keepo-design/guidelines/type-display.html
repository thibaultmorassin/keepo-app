<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  
</style></head><body>
<div style="font-family:var(--font-display);color:var(--text-primary)">
  <div style="font-size:44px;line-height:1;letter-spacing:-0.03em;font-weight:700">5 294 €</div>
  <div style="font-size:30px;line-height:1.08;letter-spacing:-0.02em;font-weight:700;margin-top:6px">Vos garanties</div>
  <div style="font-size:22px;line-height:1.15;letter-spacing:-0.015em;font-weight:600;margin-top:6px">Qu'est-ce qui ne va pas ?</div>
  <div style="font-size:17px;line-height:1.25;letter-spacing:-0.01em;font-weight:600;margin-top:6px">Lave-vaisselle Bosch Serie 6</div>
</div></body></html>
