<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: 18px 20px;
        background: var(--bg-app);
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: stretch;
      }
      .sw {
        flex: 1;
        border-radius: var(--radius-tile);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 86px;
        box-sizing: border-box;
      }
      .sw b {
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sw code {
        font-family: var(--font-mono);
        font-size: 10.5px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; align-items: center; gap: 18px">
      <div
        style="
          width: 62px;
          height: 62px;
          border-radius: 20px;
          background: var(--brand);
          display: grid;
          place-items: center;
          color: var(--paper-0);
          font-family: var(--font-display);
          font-size: 30px;
          font-weight: 800;
          letter-spacing: -0.04em;
        "
      >
        P
      </div>
      <div>
        <div
          style="
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.035em;
            color: var(--text-primary);
          "
        >
          Keepo
        </div>
        <div
          style="font-size: 13px; color: var(--text-secondary); margin-top: 2px"
        >
          Gardez la Keepo.
        </div>
      </div>
    </div>
    <p
      style="
        font-size: 12px;
        color: var(--text-muted);
        margin: 16px 0 0;
        max-width: 460px;
      "
    >
      Placeholder only. No brand mark was provided, so nothing has been drawn —
      replace this tile with the real asset when it exists.
    </p>
  </body>
</html>
