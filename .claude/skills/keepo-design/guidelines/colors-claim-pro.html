<!-- @dsCard group="Colors" viewport="700x150" name="Claim coral & Pro violet" subtitle="Two single-purpose colours — problems, and paid features" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--coral-100);color:var(--coral-700)"><b>coral 100</b><code>#FCEBE6</code></div>
  <div class="sw" style="background:var(--coral-600);color:#fff"><b>coral 600</b><code>#D0402C · claim</code></div>
  <div class="sw" style="background:var(--coral-700);color:#fff"><b>coral 700</b><code>#A62F1F</code></div>
  <div class="sw" style="background:var(--ultra-100);color:var(--ultra-600)"><b>ultra 100</b><code>#EDECFD</code></div>
  <div class="sw" style="background:var(--ultra-600);color:#fff"><b>ultra 600</b><code>#4B49C8 · Pro</code></div>
</div></body></html>
