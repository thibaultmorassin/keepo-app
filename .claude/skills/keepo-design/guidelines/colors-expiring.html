<!-- @dsCard group="Colors" viewport="700x150" name="Expiring — amber" subtitle="Under 45 days left; urgency without alarm" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--amber-100);color:var(--amber-700)"><b>amber 100</b><code>#FDF2DE</code></div>
  <div class="sw" style="background:var(--amber-200);color:var(--amber-700)"><b>amber 200</b><code>#FAE0B4</code></div>
  <div class="sw" style="background:var(--amber-500);color:#fff"><b>amber 500</b><code>#E08A12 · bar</code></div>
  <div class="sw" style="background:var(--amber-600);color:#fff"><b>amber 600</b><code>#B4680A</code></div>
  <div class="sw" style="background:var(--amber-700);color:#fff"><b>amber 700</b><code>#8F5207 · text</code></div>
</div></body></html>
