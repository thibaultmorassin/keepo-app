<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  
</style></head><body>
<div style="color:var(--text-primary)">
  <p style="font-size:16px;line-height:1.5;margin:0 0 8px">16 · Le mieux, c'est de le faire dans le magasin, ticket encore en main.</p>
  <p style="font-size:14.5px;line-height:1.55;margin:0 0 8px">14.5 · On lit le magasin, la date, le prix et la durée — vous n'avez plus qu'à vérifier.</p>
  <p style="font-size:13px;line-height:1.35;font-weight:600;margin:0 0 8px">13 · Libellé de champ, bouton secondaire</p>
  <p style="font-size:12px;line-height:1.4;color:var(--text-secondary);margin:0">12 · Darty Beaugrenelle · 4 sept. 2024</p>
</div></body></html>
