<!-- @dsCard group="Spacing" viewport="700x180" name="Screen rhythm" subtitle="18px gutters, 9px between rows, 18px between blocks" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  .screen{border:1px dashed var(--border-strong);border-radius:var(--radius-card);padding:18px;display:flex;flex-direction:column;gap:18px;max-width:320px}
  .blk{background:var(--bg-card);box-shadow:var(--shadow-sm);border-radius:var(--radius-card);height:44px}
  .list{display:flex;flex-direction:column;gap:9px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>

<div style="display:flex;gap:16px;align-items:center">
  <div class="screen">
    <div class="blk" style="height:64px"></div>
    <div class="list"><div class="blk"></div><div class="blk"></div><div class="blk"></div></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="lbl">--gutter-screen · 18px</span>
    <span class="lbl">--gap-section · 18px</span>
    <span class="lbl">--gap-list · 9px</span>
    <span class="lbl">--tap-min · 44px</span>
  </div>
</div></body></html>
