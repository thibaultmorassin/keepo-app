<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="Warm neutrals — the app never sits on pure white" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-tile); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 86px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .sw code { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
  
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--paper-0);border:1px solid var(--line);color:var(--ink-900)"><b>Paper 0</b><code>#FCFAF6 · app</code></div>
  <div class="sw" style="background:var(--paper-1);border:1px solid var(--line);color:var(--ink-900)"><b>Paper 1</b><code>#FFFFFF · card</code></div>
  <div class="sw" style="background:var(--paper-2);color:var(--ink-900)"><b>Paper 2</b><code>#F2EEE5 · sunken</code></div>
  <div class="sw" style="background:var(--ink-500);color:var(--paper-0)"><b>Ink 500</b><code>#706B60 · secondary</code></div>
  <div class="sw" style="background:var(--ink-900);color:var(--paper-0)"><b>Ink 900</b><code>#1B1A17 · primary</code></div>
</div></body></html>
